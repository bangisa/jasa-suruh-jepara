<VirtualHost *:80>
    ServerName jasasuruhjepara.isacool.my.id
    DocumentRoot /var/www/jasasuruhjepara

    <Directory /var/www/jasasuruhjepara>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/jasasuruhjepara_error.log
    CustomLog ${APACHE_LOG_DIR}/jasasuruhjepara_access.log combined
</VirtualHost>
